global_evaluation_notes:
  success_criteria_are: local_geometric_proxies_not_paper_official_scores
  unsupported_or_inaccurate_current_proxy_tasks: [S12, S13, S14, S15, S18, S19, S20]
  direction_mapping_updated_but_not_validated: [S11, S16, S17]
  visual_asset_suitability_checks_required_before_build: [S12, S16, S17, S18, S19, S20]
  physical_interaction_caveat: >-
    Open bowl/cup/toaster cavities must remain real openings in both render and collision geometry;
    a solid primitive or center-distance-only success check is not equivalent to containment.
