      appearance_notes: [bowl_has_high_curved_sides_and_visible_open_cavity]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      bowl:
        role: manipulated_object
        asset: ycb_bowl_024
