          asset_path: assets/third_party/food_v8/croissant_scan/croissant_2k.gltf
          orientation: y_up_to_z_up
          source_license: CC0-1.0
          source_asset: Poly Haven croissant
          appearance: croissant_per_user_reference_interpretation; exact_paper_asset_unknown
        mobility: static_visual_distractor
        reset_relation: resting_inside_bowl_on_inner_floor
      bowl:
        role: source_container
        asset: ycb_bowl_024
        dimensions_m: [0.200, 0.200, 0.105]
        dimensions_order: [x_diameter, y_diameter, z_height]
        inner_opening_diameter_m: 0.170
        color_rgb: [0.92, 0.09, 0.025]
        visual_geometry: {type: procedural_template, template_ref: orange_red_bowl_v1, appearance: deep_open_red_orange_bowl}
        mobility: static_rigid
        reset_relation: open_container_on_table
      table_tape_outline:
        role: visual_only_table_reference_mark
