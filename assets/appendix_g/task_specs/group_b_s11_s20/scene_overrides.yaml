tasks:
  - id: S11
    instruction: Move the bowl on the left to the right side of the table
    image_reference:
      inventory: [one_deep_red_orange_open_bowl, one_small_white_patterned_cup, one_dark_slim_rod, one_dark_tape_rectangle]
      observed_relations: [bowl_screen_left_and_front_of_cup, cup_screen_right_and_back_of_bowl, rod_front_left, tape_behind_bowl]
      appearance_notes: [bowl_is_deep_and_round_not_a_shallow_plate]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      bowl:
        role: manipulated_object
        asset: ycb_bowl_024
        dimensions_m: [0.200, 0.200, 0.105]
        dimensions_order: [x_diameter, y_diameter, z_height]
        color_rgb: [0.92, 0.07, 0.02]
        visual_geometry: {type: procedural_template, template_ref: orange_red_bowl_v1}
        mobility: movable_rigid
        reset_relation: empty_open_container_on_table
      table_tape_outline:
        role: visual_only_table_reference_mark
        dimensions_m: [0.22, 0.22, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
        reset_relation: {relation: lies_on, reference: table_top}
      paper_cup_distractor:
        role: static_visual_distractor
        dimensions_m: [0.065, 0.065, 0.075]
        color_rgb: [0.94, 0.94, 0.91]
        visual_geometry: {type: procedural_template, template_ref: paper_cup_v1}
        collision_geometry: none
        mobility: static_visual_distractor
        reset_relation: {relation: rests_on, reference: table_top}
      pen_distractor:
        role: static_visual_distractor
        dimensions_m: [0.14, 0.010, 0.010]
        color_rgb: [0.12, 0.13, 0.14]
        visual_geometry: {type: procedural_template, template_ref: mechanical_pencil_v1}
        collision_geometry: none
        mobility: static_visual_distractor
        reset_relation: {relation: rests_on, reference: table_top}
    layouts:
      0:
        initial_poses:
          bowl: {position_m: [0.43, 0.04, 0.0975], rpy_deg: [0, 0, 0]}
          table_tape_outline: {position_m: [0.43, 0.25, 0.0455], rpy_deg: [0, 0, 0]}
          paper_cup_distractor: {position_m: [0.68, 0.24, 0.0825], rpy_deg: [0, 0, 0]}
          pen_distractor: {position_m: [0.39, -0.12, 0.050], rpy_deg: [0, 0, 28]}
      1:
        initial_poses:
          bowl: {position_m: [0.46, 0.08, 0.0975], rpy_deg: [0, 0, 0]}
          table_tape_outline: {position_m: [0.46, 0.29, 0.0455], rpy_deg: [0, 0, 0]}
          paper_cup_distractor: {position_m: [0.71, 0.28, 0.0825], rpy_deg: [0, 0, 0]}
          pen_distractor: {position_m: [0.42, -0.08, 0.050], rpy_deg: [0, 0, 28]}
    success:
      all:
        - {object: bowl, predicate: displacement_along_xy_at_least, axis_xy: [1, 0], distance_m: 0.25}
        - {object: bowl, predicate: center_in_camera_side, side: right, axis_xy: [1, 0], origin_xy_m: [0.55, 0.022], minimum_projection_m: 0.10}
        - {object: bowl, predicate: resting_on_table, max_bottom_error_m: 0.008, max_speed_mps: 0.02, stable_duration_s: 0.5}
    current_proxy:
      status: direction_spec_updated_not_validated
      note: Image-right is qualitatively +X in the review-camera convention; paper coordinates are unknown.
    unsupported_interactions: []

  - id: S12
    instruction: Pick up the pencil and put it on the bowl
    image_reference:
      inventory: [one_deep_red_orange_open_bowl, one_long_slim_pencil, one_small_white_patterned_cup]
      observed_relations: [bowl_screen_left_and_front, cup_screen_right_and_back_of_bowl, pencil_screen_right_and_front_of_cup]
      appearance_notes: [pencil_appears_wooden_yellow_or_tan_with_dark_tip, cup_is_a_separate_visible_object]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      pencil:
        role: manipulated_object
        asset: draft_pencil
        fallback_asset: project_procedural_cc0
        dimensions_m: [0.140, 0.009, 0.009]
        dimensions_order: [x_length, y_diameter, z_diameter]
        color_rgb: [0.18, 0.18, 0.17]
        visual_geometry: {type: procedural_template, template_ref: pencil_v1}
        mobility: movable_rigid
        reset_relation: resting_separately_on_table
      bowl:
        role: destination_support
        asset: ycb_bowl_024
        dimensions_m: [0.200, 0.200, 0.105]
        dimensions_order: [x_diameter, y_diameter, z_height]
        inner_opening_diameter_m: 0.170
        color_rgb: [0.92, 0.09, 0.025]
        visual_geometry: {type: procedural_template, template_ref: orange_red_bowl_v1, appearance: deep_open_red_orange_bowl}
        mobility: static_rigid
        reset_relation: empty_open_container_on_table
      white_cup_distractor:
        role: static_visual_distractor
        dimensions_m: [0.075, 0.075, 0.09]
        color_rgb: [0.94, 0.94, 0.91]
        visual_geometry: {type: procedural_template, template_ref: paper_cup_v1, appearance: small_white_paper_cup_with_dark_print}
        collision_geometry: none
        mobility: static_visual_distractor
        reset_relation: {relation: rests_on, reference: table_top}
      table_tape_outline:
        role: visual_only_table_reference_mark
        dimensions_m: [0.22, 0.22, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
        reset_relation: {relation: lies_on, reference: table_top}
    layouts:
      0:
        initial_poses:
          pencil: {position_m: [0.740, -0.120, 0.0495], rpy_deg: [0, 0, 30]}
          bowl: {position_m: [0.480, -0.050, 0.0975], rpy_deg: [0, 0, 0]}
          white_cup_distractor: {position_m: [0.630, 0.180, 0.090], rpy_deg: [0, 0, 0]}
          table_tape_outline: {position_m: [0.400, 0.240, 0.0455], rpy_deg: [0, 0, 0]}
      1:
        initial_poses:
          pencil: {position_m: [0.770, -0.080, 0.0495], rpy_deg: [0, 0, 30]}
          bowl: {position_m: [0.510, -0.010, 0.0975], rpy_deg: [0, 0, 0]}
          white_cup_distractor: {position_m: [0.660, 0.220, 0.090], rpy_deg: [0, 0, 0]}
          table_tape_outline: {position_m: [0.420, 0.280, 0.0455], rpy_deg: [0, 0, 0]}
    success:
      all:
        - {object: pencil, predicate: center_xy_within, reference_object: bowl, distance_m: 0.015}
        - {object: pencil, predicate: center_z_in_range, minimum_m: 0.122, maximum_m: 0.140}
        - {object: pencil, predicate: long_axis_parallel_xy, axis_xy: [0, 1], tolerance_deg: 15}
        - {object: pencil, predicate: supported_by_rim, support_object: bowl, stable_duration_s: 0.5, max_speed_mps: 0.02}
    current_proxy:
      status: insufficient_semantics
      note: Center-distance place_on_object does not distinguish resting across the rim from inside or merely near the bowl.
    unsupported_interactions: [rim_support_contact_not_measured_by_current_proxy]

  - id: S13
    instruction: Pick the marker up from the table and put it in the bowl
    image_reference:
      inventory: [one_deep_red_orange_open_bowl, one_white_red_marker, one_slim_dark_pencil]
      observed_relations: [bowl_near_center_and_back, marker_left_and_front_of_bowl, pencil_right_and_front_of_bowl]
      appearance_notes: [marker_and_pencil_are_distinct_objects]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      marker:
        role: manipulated_object
        asset: ycb_marker_040
        dimensions_m: [0.125, 0.014, 0.014]
        dimensions_order: [x_length, y_diameter, z_diameter]
        visual_geometry: {type: procedural_template, template_ref: marker_white_red_v1}
        mobility: movable_rigid
        reset_relation: resting_separately_on_table
      bowl:
        role: destination_container
        asset: ycb_bowl_024
        dimensions_m: [0.200, 0.200, 0.105]
        dimensions_order: [x_diameter, y_diameter, z_height]
        inner_opening_diameter_m: 0.170
        color_rgb: [0.92, 0.09, 0.025]
        visual_geometry: {type: procedural_template, template_ref: orange_red_bowl_v1, appearance: deep_open_red_orange_bowl}
        mobility: static_rigid
        # The builder treats `static_rigid` as dynamic unless this flag is set.
        static: true
        reset_relation: empty_open_container_on_table
      pen_distractor:
        role: static_visual_distractor
        asset: draft_pencil
        fallback_asset: project_procedural_cc0
        dimensions_m: [0.140, 0.009, 0.009]
        dimensions_order: [x_length, y_diameter, z_diameter]
        color_rgb: [0.10, 0.13, 0.18]
        visual_geometry: {type: procedural_template, template_ref: pencil_v1}
        mobility: static_visual_distractor
        collision_geometry: none
        reset_relation: resting_separately_on_table
      table_tape_outline:
        role: visual_only_table_reference_mark
        dimensions_m: [0.22, 0.22, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
        reset_relation: {relation: lies_on, reference: table_top}
    layouts:
      0:
        initial_poses:
          marker: {position_m: [0.400, -0.090, 0.052], rpy_deg: [0, 0, 35]}
          bowl: {position_m: [0.530, 0.060, 0.0975], rpy_deg: [0, 0, 0]}
          pen_distractor: {position_m: [0.730, -0.130, 0.0495], rpy_deg: [0, 0, -20]}
          table_tape_outline: {position_m: [0.640, 0.350, 0.0455], rpy_deg: [0, 0, 0]}
      1:
        initial_poses:
          # Same object relation, but a meaningfully different reach/transfer.
          marker: {position_m: [0.430, -0.060, 0.052], rpy_deg: [0, 0, 35]}
          bowl: {position_m: [0.560, 0.090, 0.0975], rpy_deg: [0, 0, 0]}
          pen_distractor: {position_m: [0.760, -0.100, 0.0495], rpy_deg: [0, 0, -20]}
          table_tape_outline: {position_m: [0.640, 0.350, 0.0455], rpy_deg: [0, 0, 0]}
    reset_relations:
      - {predicate: outside_container, item: marker, container: bowl}
      - {predicate: separated_xy, objects: [marker, bowl], minimum_distance_m: 0.15}
    success:
      all:
        - {object: marker, predicate: fraction_inside_container_at_least, container: bowl, fraction: 0.60, allow_protrusion_above_rim: true}
        # The scan is 125 mm long and the visual bowl opening is about 170 mm: a
        # loose 60 mm center threshold would accept a marker balanced on the rim.
        - {object: marker, predicate: center_xy_within, reference_object: bowl, distance_m: 0.008}
        - {object: marker, predicate: lift_bottom_above_bowl_rim, clearance_m: 0.005}
        - {object: marker, predicate: resting_in_container, container: bowl, stable_duration_s: 1.0, max_speed_mps: 0.02}
    current_proxy:
      status: local_approximate_evaluator_implemented
      note: The local runner now checks the marker's full projected box footprint against a circular opening, a rim-clearance lift during the episode, and a 1-second low-speed rest. It is not the paper metric. The round scanned visual still uses a square hidden collision shell, and physical contact/mesh-volume overlap are not measured.
    unsupported_interactions: [round_mesh_collision_and_contact_sensor_confirmation]

  - id: S14
    instruction: Place the bowl next to the marker
    image_reference:
      inventory: [one_deep_red_orange_open_bowl, one_white_red_marker, one_dark_tape_rectangle]
