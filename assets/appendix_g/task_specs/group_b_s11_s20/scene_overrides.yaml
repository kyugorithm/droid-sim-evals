# Deterministic local reconstructions for Appendix G seen tasks S11-S20.
# These are NOT the unpublished original DROID prop poses or official scores.
# Visual-fidelity pass: dimensions, colors, orientations, and relative poses below
# are estimates from the low-resolution Appendix G reference photos; exact CAD,
# metric poses, and camera calibration were not published.
# Some canonical visual_geometry.template_ref values below are planned template
# interfaces; they require a builder that implements those refs to affect USD.
schema_version: 1
source_paper: https://arxiv.org/html/2602.15922
task_ids: [S11, S12, S13, S14, S15, S16, S17, S18, S19, S20]
reconstruction_status: candidate_built_and_layout0_previewed_not_inference_ready

frame:
  name: droid_robot_base
  units: meters
  axes:
    x: forward_away_from_robot
    y: table_depth_toward_photo_back
    z: up
  camera_ground_convention:
    review_camera_position_side: negative_y
    image_right: +x_broadly
    image_left: -x_broadly
    photo_back: +y_broadly
    photo_front: -y_broadly
    basis: local_project_convention_from_existing_builder_camera_note
    paper_calibrated: false
    note: >-
      Qualitative mapping for reading the reference photographs. Do not interpret
      screen left/right as world Y; preserve this broad mapping while refining
      the review camera.
  pose_reference: center_of_target_dimensions
  rpy_order: xyz
  rpy_units: degrees
  table:
    top_z_m: 0.045
    bounds_xy_m: {x: [0.20, 0.90], y: [-0.478, 0.522]}
    origin_note: Existing sim-evals smoke-scene robot frame; not published Appendix G calibration.
  layouts:
    pairing: same_layout_id_is_paired_across_models
    ids: [0, 1]
    randomization: none

# Asset records are intentionally repeated per object so each task is
# independently consumable. Existing repository paths are relative to repo root.
# `dimensions_m` are chosen local reconstruction bounds, not claimed paper or
# scanned-object measurements. Scale each source mesh to its declared target
# bounds; if its proportions/affordances become unsuitable, use the stated
# deterministic fallback. Preserve functional cavities in render/collision.
# Builder note: `asset` records provenance/planned source selection; the current
# scene builder only imports its explicitly registered YCB object names and
# templates. It does not automatically import arbitrary GLB/CC0 entries below.
