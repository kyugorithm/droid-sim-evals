        dimensions_order: [x_diameter, y_diameter, z_height]
        color_rgb: [0.92, 0.09, 0.025]
        visual_geometry: {type: procedural_template, template_ref: orange_red_bowl_v1, appearance: deep_open_red_orange_bowl}
        mobility: movable_rigid
        reset_relation: empty_container_separated_from_marker
      marker:
        role: stationary_reference_object
        asset: ycb_marker_040
        dimensions_m: [0.125, 0.014, 0.014]
        dimensions_order: [x_length, y_diameter, z_diameter]
        visual_geometry: {type: procedural_template, template_ref: marker_white_red_v1}
        mobility: static_rigid
        reset_relation: resting_on_table
      table_tape_outline:
        role: visual_only_table_reference_mark
        dimensions_m: [0.22, 0.22, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
        reset_relation: {relation: lies_on, reference: table_top}
    layouts:
      0:
        initial_poses:
          bowl: {position_m: [0.700, -0.030, 0.0975], rpy_deg: [0, 0, 0]}
          marker: {position_m: [0.450, -0.030, 0.053], rpy_deg: [0, 0, -45]}
          table_tape_outline: {position_m: [0.400, 0.100, 0.0455], rpy_deg: [0, 0, 0]}
      1:
        initial_poses:
          bowl: {position_m: [0.730, 0.000, 0.0975], rpy_deg: [0, 0, 0]}
          marker: {position_m: [0.480, 0.000, 0.053], rpy_deg: [0, 0, -45]}
          table_tape_outline: {position_m: [0.430, 0.130, 0.0455], rpy_deg: [0, 0, 0]}
    reset_relations:
      - {predicate: separated_xy, objects: [bowl, marker], minimum_distance_m: 0.25}
    success:
      all:
        - {object: bowl, predicate: footprint_gap_to, reference_object: marker, minimum_gap_m: 0.010, maximum_gap_m: 0.060}
        - {object: bowl, predicate: resting_on_table, max_bottom_error_m: 0.008, stable_duration_s: 0.5}
        - {object: marker, predicate: resting_on_table, max_bottom_error_m: 0.008, stable_duration_s: 0.5}
    current_proxy:
      status: insufficient_semantics
      note: Pair-center distance can report success for overlap; use footprint gap and table contact.
    unsupported_interactions: [nonoverlap_adjacency_not_measured_by_current_proxy]

  - id: S15
    instruction: Remove a lemon from the bowl
    image_reference:
      inventory: [one_deep_red_orange_open_bowl, one_small_yellow_lemon_like_object, one_larger_yellow_or_amber_item_of_uncertain_identity]
      observed_relations: [both_yellow_items_inside_bowl_at_reset, larger_item_is_visibly_bigger_than_lemon]
      appearance_notes: [reference_thumbnail_is_rotated_relative_to_the_other_seen_task_photos, do_not_assume_the_second_item_is_a_specific_fruit]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
