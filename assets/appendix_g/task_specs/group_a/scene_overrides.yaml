physics_contract:
  verification: not_run
  implementation_status: candidate_USD_built_but_task_specific_visual_or_collision_support_incomplete
  supported_scope: >-
    Only rigid-body proxy translation, contact, and settling are intended to be
    represented after scene implementation. This is not evidence that a task
    currently runs or that the paper's physical setup has been reproduced.
  unsupported_scope:
    - deformable_cloth_or_glove_dynamics
    - articulated_drawer_or_scissor_hinge_motion
    - material_friction_or_grasp_fidelity_validation
    - paper_success_metric_or_paper_exact_object_poses

tasks:
  # S01/S02 are included here so their image-derived poses are explicit and
  # deterministic alongside S03-S10. IDs and evaluator/reset meanings remain
  # those in configs/appendix_g_tasks.yaml.
  S01:
    readiness: visual_proxy_only
    instruction: Move the cup forward then put the marker inside the cup
    image_reference:
      inventory: [one_white_open_cup, one_blue_handled_scissors, one_white_marker_with_red_cap]
      observed_relations: [cup_between_scissors_and_marker, cup_near_front_of_pair]
      appearance_notes: [cup_is_small_and_tapered, scissors_have_blue_handles_and_steel_blades, marker_is_slim_white_with_red_end]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      cup:
        role: movable_task_container
        dimensions_m: [0.080, 0.080, 0.085]
        visual_geometry:
          type: procedural_template
          template_ref: paper_cup_v1
          note: Preserve the manifest cup target and move-then-contain evaluation assumptions.
      scissors:
        role: visual_distractor
        dimensions_m: [0.096, 0.202, 0.016]
        visual_geometry:
          type: repository_mesh
          template_ref: scissors
          asset_source: YCB_037_scissors_google_16k
          local_long_axis: y
          material_override: {handle_regions_srgb: [0.025, 0.19, 0.72], blades: preserve_steel_texture}
      marker:
        role: movable_task_object
        dimensions_m: [0.016, 0.125, 0.016]
        visual_geometry:
          type: procedural_template
          template_ref: marker_white_red_v1
          local_long_axis: y
    layouts:
      0:
        initial_poses:
          cup: {position_m: [0.52, 0.022, 0.0875], rpy_deg: [0, 0, 0]}
          scissors: {position_m: [0.37, 0.04, 0.053], rpy_deg: [0, 0, -35]}
          marker: {position_m: [0.78, 0.06, 0.053], rpy_deg: [0, 0, -80]}
      1:
        initial_poses:
          cup: {position_m: [0.555, -0.053, 0.0875], rpy_deg: [0, 0, 0]}
          scissors: {position_m: [0.405, -0.035, 0.053], rpy_deg: [0, 0, -35]}
          marker: {position_m: [0.815, -0.015, 0.053], rpy_deg: [0, 0, -80]}

  S02:
    readiness: visual_proxy_only
    instruction: Put the marker in the blue box
    image_reference:
      inventory: [one_turquoise_perforated_basket_with_warm_colored_top_rim, one_white_red_marker, one_blue_handled_scissors, one_dark_tape_rectangle]
      observed_relations: [basket_at_back_center, scissors_front_left_of_basket, marker_front_right_of_basket, tape_left_of_basket]
      appearance_notes: [basket_body_rounds_and_tapers_toward_base, warm_orange_brown_top_rim_or_handle]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      marker:
        role: movable_task_object
        dimensions_m: [0.016, 0.125, 0.016]
        visual_geometry:
          type: procedural_template
          template_ref: marker_white_red_v1
          local_long_axis: y
      blue_box:
        role: static_open_container_target
        dimensions_m: [0.18, 0.148, 0.08]
        color_rgb: [0.03, 0.55, 0.67]
        visual_geometry:
          type: procedural_template
          template_ref: project_perforated_turquoise_basket_v1
          source_asset: project_authored_geometry
          source_license: CC0-1.0
        collision_geometry: preserve_manifest_blue_box_inner_footprint
      scissors:
        role: visual_distractor
        dimensions_m: [0.096, 0.202, 0.016]
        visual_geometry:
          type: repository_mesh
          template_ref: scissors
          asset_source: YCB_037_scissors_google_16k
          local_long_axis: y
          material_override: {handle_regions_srgb: [0.025, 0.19, 0.72], blades: preserve_steel_texture}
      table_tape_outline:
        role: visual_only_table_reference_mark
        dimensions_m: [0.20, 0.20, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
        reset_relation: {relation: lies_on, reference: table_top}
    layouts:
      0:
        initial_poses:
          marker: {position_m: [0.73, -0.105, 0.053], rpy_deg: [0, 0, 80]}
          blue_box: {position_m: [0.60, 0.16, 0.085], rpy_deg: [0, 0, 90]}
          scissors: {position_m: [0.40, -0.08, 0.053], rpy_deg: [0, 0, -35]}
          table_tape_outline: {position_m: [0.39, 0.13, 0.0455], rpy_deg: [0, 0, 0]}
      1:
        initial_poses:
          marker: {position_m: [0.76, -0.075, 0.053], rpy_deg: [0, 0, 80]}
          blue_box: {position_m: [0.63, 0.19, 0.085], rpy_deg: [0, 0, 90]}
          scissors: {position_m: [0.43, -0.05, 0.053], rpy_deg: [0, 0, -35]}
          table_tape_outline: {position_m: [0.42, 0.16, 0.0455], rpy_deg: [0, 0, 0]}

  S03:
    readiness: not_inference_ready
    readiness_blockers:
      - rebuilt_preview_must_confirm_cabinet_open_drawer_and_glove_pair_visuals
      - remove_and_place_evaluator_does_not_verify_drawer_exit_and_table_support
    candidate_assets_not_selected:
      drawer: innerscene_low_store_storage_drawer
      glove_pair: sketchfab_work_gloves
    instruction: Remove the pair of gloves from the open drawer and put it on the table
    image_reference:
      inventory: [one_low_wooden_cabinet_with_open_drawer, one_paired_glove_task_object, one_dark_tape_rectangle]
      observed_relations: [cabinet_back_right_of_tape, glove_pair_at_open_drawer_front_or_top_edge]
      appearance_notes: [cabinet_has_body_and_drawer_fascia_not_a_standalone_tray, glove_color_and_exact_identity_uncertain]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    local_interpretation: >-
      One rigid paired-glove proxy begins draped over the front lip of an already-open,
      static drawer; any tabletop placement outside the drawer is sufficient. The visible tape
      outline is visual context only, not an added goal.
    objects:
      - id: table_drop_outline
        role: visual_only_table_reference_mark
        dimensions_m: [0.22, 0.22, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
        reset_relation: {relation: lies_on, reference: table_top}
      - id: open_drawer
        role: static_open_storage_fixture
        dimensions_m: [0.26, 0.18, 0.14]
        visual_geometry:
          type: procedural_template
          template_ref: low_two_tier_drawer_cabinet_v1
          appearance: low_honey_oak_cabinet_with_upper_drawer_open_and_visible_lower_fascia
          open_drawer_is_part_of_cabinet_body: true
        collision_geometry:
          type: static_open_tray
          interior_dimensions_m: [0.21, 0.13, 0.06]
          floor_top_offset_from_center_z_m: -0.040
          opening_normal_robot_frame: [0, -1, 0]
        mobility: static
        reset_relation: {relation: rests_on, reference: table_top}
      - id: glove_pair
        role: task_object_single_rigid_paired_gloves
        dimensions_m: [0.141, 0.12, 0.057]
        color_rgb: [0.045, 0.050, 0.055]
        visual_geometry:
          type: external_glb
          asset_path: assets/third_party/gloves_v8/glove-pair-draped.glb
          orientation: y_up_to_z_up
          source_license: CC0
          source_url: https://static.makehumancommunity.org/assets/assetpacks/gloves01.html
        visual_estimate: dark_glove_pair_shape_and_color_are_uncertain_in_thumbnail
        source_candidate: sketchfab_work_gloves
        selected_visual_source: makehuman_MargaretToigo_short_gloves_posed_derivative
        builder_visual_support: integrated_procedural_template_alias_preview_pending
        collision_geometry: single_convex_rigid_proxy
        mobility: movable_rigid_body
        reset_relation:
          relation: at_open_drawer_front_edge
          reference: open_drawer
          placement: over_front_lip_as_a_rigid_pair_proxy
    layouts:
      0:
        initial_poses:
          table_drop_outline: {position_m: [0.39, -0.04, 0.0455], rpy_deg: [0, 0, 0]}
          open_drawer: {position_m: [0.62, 0.20, 0.115], rpy_deg: [0, 0, 90]}
          glove_pair: {position_m: [0.62, -0.015, 0.170], rpy_deg: [0, 0, 0]}
      1:
        initial_poses:
          table_drop_outline: {position_m: [0.39, -0.04, 0.0455], rpy_deg: [0, 0, 0]}
          open_drawer: {position_m: [0.59, 0.24, 0.115], rpy_deg: [0, 0, 90]}
          glove_pair: {position_m: [0.59, 0.025, 0.170], rpy_deg: [0, 0, 0]}
    interactions:
      supported_by_declared_proxy: [rigid_pick_from_static_tray, rigid_place_on_table]
      unsupported_physical_interactions:
        - flexible_glove_deformation_and_individual_finger_grasps
        - drawer_sliding_or_handle_actuation
    success_conditions:
      evaluator_status: not_implemented_in_current_evaluator
      all:
        - predicate: glove_collision_bounds_disjoint_from_drawer_interior
          subject: glove_pair
          reference: open_drawer
          minimum_clearance_m: 0.005
        - predicate: supported_by_table_top
          subject: glove_pair
          bottom_height_tolerance_m: 0.008
        - predicate: xy_bounds_inside_table_bounds
          subject: glove_pair
      settle: {linear_speed_max_m_s: 0.02, continuous_duration_s: 0.5}
      semantic_gap: Current remove_and_place proxy does not test drawer exit plus table support.

  S04:
    readiness: not_inference_ready
    readiness_blockers:
      - paper_thumbnail_shows_marker_inserted_upright_in_the_white_cup
      - photographed_reset_does_not_define_the_instruction_success_protocol
    instruction: Put the marker on table
    local_interpretation: >-
      Match the photographed reset state: the white patterned cup is behind the
      tape outline and the red-capped marker is inserted upright in its opening.
      The image-grounded reset relation is a visual observation; it does not
      resolve how the instruction's initial state was established.
    image_reference:
      inventory: [one_dark_tape_rectangle, one_small_white_patterned_open_cup, one_white_red_marker]
      observed_relations: [cup_beyond_tape_toward_photo_back, marker_inserted_upright_in_cup, red_marker_end_protrudes_above_rim]
      coordinates_are: qualitative_image_grounded_estimates_not_paper_poses
    objects:
      - id: table_target_outline
        role: visual_only_table_mark
        dimensions_m: [0.20, 0.20, 0.001]
        visual_geometry: {type: procedural_template, template_ref: tape_rectangle_outline_v1}
        collision_geometry: none
        mobility: static
