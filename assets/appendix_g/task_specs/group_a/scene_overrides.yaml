schema_version: 1
status: deterministic_local_proxy_spec_only
paper_exact_scene: false
simulation_or_inference_run: false
# Metric sizes, tabletop coordinates, and rotations below are visual estimates
# from the small Appendix G thumbnails; the paper does not publish CAD or poses.
coordinate_frame:
  name: franka_droid_robot_base
  units: m
  axes:
    x: forward_from_robot_base_across_table
    y: table_depth_toward_photo_back
    z: up
  camera_ground_convention:
    review_camera_position_side: negative_y
    image_right: positive_x_broadly
    photo_back: positive_y_broadly
    calibration_status: qualitative_reference_mapping_not_camera_calibration
    note: >-
      Use this mapping when translating visible left/right and front/back relations.
      Perspective and the review camera will be refined separately; do not rotate
      or relabel the photographed layouts to compensate.
  pose_anchor: visual_and_collision_bounding_box_center_unless_object_overrides_anchor
  yaw: degrees_about_positive_z_ccw
  source_and_limit: >-
    Local reconstruction in the robot-rooted frame used by the repository scene
    builder. Appendix G does not publish robot-frame calibration or object poses.
  shared_table_top:
    geometry: axis_aligned_box
    dimensions_m: [0.70, 1.00, 0.04]
    center_robot_frame_m: [0.55, 0.022, 0.025]
    top_z_m: 0.045
    xy_bounds_m: {x: [0.20, 0.90], y: [-0.478, 0.522]}
    mobility: static
  paired_layouts:
    ids: [0, 1]
    rule: explicit_positions_no_randomization
    meaning: >-
      Layout 0 is the canonical initial state. Layout 1 is a deterministic nearby
      paired placement; object coordinates are listed separately in every task.

