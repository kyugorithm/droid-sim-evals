schema_version: 1
scope: appendix_g_unseen_group_d
source_manifest: configs/appendix_g_tasks.yaml
source_manifest_is_modified: false
interpretation: local_deterministic_scene_proxy_not_official_paper_scene

reference_image_review:
  evidence: visual_audit_20261014/U01_U05.jpg through U16_U20.jpg, labeled task rows
  paper_refs_basename_warning: >-
    Individual paper_refs/Uxx.png basenames are not a reliable U-task mapping.
    Use the labeled comparison-sheet row and the paper Appendix G mapping.
  inspection_only_camera: >-
    Auto-framed reference view, 28 degree elevation from -Y. Screen-right is
    world +X and screen-back is world +Y. Policy and existing review cameras
    are unchanged.
  template_contract:
    U11: tripod_v1; wide_brim_hat_v1
    U12: gently_curved_paper_stack_v1; binder_clip_v1
    U13: toaster_with_real_slots_v1; bread_v7_slice; plate_round_v1; shallow_bowl_v1
    U14: drawstring_pouch_v1; folded_towel_v1
    U15: bread_v7_slice; mustard_bottle_v1; shallow_round_plate_v1; scissors
    U16: metal_toaster_oven_with_glass_door_rack_and_knobs_v1; croissant_v1
    U17: handled_metal_pan_v1; tomato_chopped_cluster_v1; broccoli_floret_cluster_v1; spatula_v1; paper_cup_v1
    U18: toaster_v1; toaster_lever_v1; bread_v7_slice; orange_round_v1
    U19: vented_fixture_v1; open_two_cubby_shelf_v1; yellow_block_v1; croissant_v1 (uncertain bread-like appearance)
    U20: open_side_hole_box_v1; cable_coil_v1
  visual_observations:
    U11: >-
      Tripod is on screen-left with three splayed legs; dark olive brimmed
      fedora is separate on screen-right. It is not a baseball cap.
    U12: >-
      One broad white paper sheet or thin stack is gently bowed; a small dark
      clip grips an edge near screen-right.
    U13: >-
      Compact dark metal toaster with a vertically protruding bread slice;
      empty warm wood-colored plate is to screen-right and small bowl behind.
    U14: >-
      Broad black fabric bag with gathered opening and a long loose drawcord;
      small blue item lies at screen-left.
    U15: >-
      Yellow mustard bottle is at screen-left. Golden bread lies flat on a
      shallow tan plate near center; blue scissors are screen-right.
    U16: >-
      Metal countertop toaster oven has a glass-front door, controls and
      visible rack; a curved croissant rests outside it.
    U17: >-
      Metal pan contains visible vegetable pieces; broad gray spatula is
      screen-left/front and a white paper cup is screen-right/front.
    U18: >-
      Toaster's narrow control face and raised lever face the camera at -Y;
      bread protrudes vertically and an orange rests to screen-left.
    U19: >-
      Vented box is screen-left/foreground. Open wood shelf is screen-right/back
      with two lower cubbies and one top surface; yellow block and small golden
      bread-like item remain separate in front.
    U20: >-
      Cardboard-colored box has an open top and through-holes in vertical side
      walls. Loose coiled wire with a free connector lies to its screen-left.
      Exact hole count and routing order are uncertain at thumbnail resolution.

# U11-U20 dimensions, colors, orientations, and reset poses below are visual
# estimates from Appendix G thumbnails; calibrated metric poses and CAD assets
# are not published. Keep the task/reset/evaluator semantics as local proxies.

world:
  units: meters
  up_axis: Z
  pose_convention: world_position_of_object_center_and_euler_xyz_degrees
  table_surface_z_m: 0.0451
  table_bounds_xy_m:
    x: [0.1986, 0.8986]
    y: [-0.4779, 0.5221]
  paired_layout_ids: [0, 1]
  reset:
    deterministic: true
    reset_all_object_poses_and_joint_states: true
    reset_emitted_particles_or_materials: true
    randomization: none
    pairing_rule: >-
      Layouts 0 and 1 use identical assets, dimensions, task relations, joint
      states, and success thresholds. Only the explicit initial poses differ.
      These are local paired variations, not recovered paper coordinates.

licenses:
  cc0_1_0:
    name: CC0 1.0 Universal
    url: https://creativecommons.org/publicdomain/zero/1.0/
    redistribution: allowed
  cc_by_4_0:
    name: Creative Commons Attribution 4.0 International
    url: https://creativecommons.org/licenses/by/4.0/
    redistribution: allowed_with_attribution_and_change_notice
  ycb_notice_path: assets/third_party/ycb/NOTICE.md
  project_authored:
    redistribution: repository_license_not_declared_by_this_spec
    notice: >-
      Procedural geometry has no third-party source; do not claim it is openly
      redistributable until the repository license is selected.

