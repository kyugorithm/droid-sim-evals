tasks:
  - id: U11
    instruction: Hook the hat onto the tripod
    env_template: tabletop_basic
    objects:
      - id: tripod
        role: fixed_hanging_fixture_with_exposed_crossbar
        asset_ref: project_proxy
        dimensions_m: [0.25, 0.25, 0.30]
        color_rgb: [0.075, 0.075, 0.080]
        visual_geometry:
          template_ref: tripod_v1
          geometry: three_splayed_legs_central_column_and_horizontal_crossbar
          foot_caps_color_rgb: [0.70, 0.035, 0.025]
        static: true
        mobility: static
        initial_pose_by_layout:
          0: {position_m: [0.43, 0.12, 0.1951], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.47, 0.04, 0.1951], euler_xyz_deg: [0, 0, 0]}
        geometry: three_splayed_legs_central_column_and_horizontal_crossbar
        pointed_top_post: true
        pointed_top_post_height_m: 0.024
        crossbar_height_above_table_m: 0.22
        crossbar_diameter_m: 0.012
        reset_relation: fixed_to_table_crossbar_starts_empty
      - id: hat
        role: movable_brimmed_fedora_with_graspable_crown_opening
        asset_ref: project_proxy
        dimensions_m: [0.145, 0.135, 0.070]
        color_rgb: [0.13, 0.14, 0.10]
        visual_geometry:
          # This exact alias is dispatched by the current builder to the
          # fedora mesh. dark_olive_fedora_v1 is not a recognized alias.
          template_ref: wide_brim_hat_v1
          requested_visual: dark_olive_fedora
          crown_dent_and_band_visible: true
          brim_to_crown_ratio: 1.55
          usable_crown_opening_faces_target: true
        static: false
        mobility: movable_rigid_proxy_with_open_rear_loop
        initial_pose_by_layout:
          0: {position_m: [0.67, -0.10, 0.0801], euler_xyz_deg: [0, 0, 90]}
          1: {position_m: [0.71, -0.18, 0.0801], euler_xyz_deg: [0, 0, 90]}
        rear_loop_inner_diameter_m: 0.030
        reset_relation: flat_on_table_loop_faces_crossbar_brim_clear_of_tripod
    local_success_criteria:
      metric: supported_loop_hook
      requires_loop_encloses_crossbar: true
      cap_center_distance_to_crossbar_m_max: 0.06
      stable_hold_seconds: 1.0
      report_as_paper_metric: false
    current_sim_support:
      physical_status: pointed_post_is_visual_only; hat_contact_geometry_not_validated
      pipeline_status: accurate_static_collision_and_supported_hook_evaluator_not_implemented
      inference_readiness: not_ready
      policy_success_claim_allowed: false

  - id: U12
    instruction: Pinch the binder clip to release the papers
    env_template: office_table
    objects:
      - id: papers
        role: clamped_paper_stack_to_be_released
        asset_ref: project_proxy
        dimensions_m: [0.28, 0.21, 0.006]
        color_rgb: [0.94, 0.935, 0.91]
        visual_geometry:
          template_ref: gently_curved_paper_stack_v1
          sheet_edges_visible: true
          slight_bow_height_m: 0.012
        static: false
        mobility: movable_rigid_stack_proxy
        initial_pose_by_layout:
          0: {position_m: [0.54, 0.01, 0.0481], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.58, -0.06, 0.0481], euler_xyz_deg: [0, 0, 0]}
        sheet_count: 5
        reset_relation: stack_flat_on_table_short_edge_under_clip_jaws
      - id: binder_clip
        role: articulated_release_tool
        asset_ref: u12_fold_clip
        dimensions_m: [0.042, 0.030, 0.034]
        color_rgb: [0.20, 0.21, 0.22]
        visual_geometry:
          template_ref: binder_clip_v1
          finish: dark_metal
          handles_visible: true
        static: false
        mobility: articulated_rigid_assembly
        initial_pose_by_layout:
          0: {position_m: [0.558, -0.105, 0.0681], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.578, -0.175, 0.0681], euler_xyz_deg: [0, 0, 0]}
        components:
          - id: handle_left
            mobility: revolute_joint
            initial_joint_angle_deg: 65
          - id: handle_right
            mobility: revolute_joint
            initial_joint_angle_deg: 65
        reset_relation: clip_clamps_paper_short_edge_handles_raised_and_robot_facing
    local_success_criteria:
      metric: clip_open_and_papers_released
      jaw_gap_m_min: 0.012
      paper_stack_displacement_from_initial_m_min: 0.06
      stable_hold_seconds: 0.5
      report_as_paper_metric: false
    current_sim_support:
      physical_status: requires_articulated_clip_and_contact_tuning
      pipeline_status: joint_scene_and_evaluator_not_implemented
      inference_readiness: not_ready
      policy_success_claim_allowed: false

  - id: U13
    instruction: Withdraw the bread from the toaster and place on the plate
    env_template: kitchen_counter
    objects:
      - id: toaster
        role: fixed_two_slot_appliance_fixture
        asset_ref: u13_toast_two
        dimensions_m: [0.167, 0.29, 0.191]
        color_rgb: [0.085, 0.095, 0.105]
        static: true
        mobility: static_visual_shell_with_custom_slot_collision
        visual_geometry:
          template_ref: toaster_with_real_slots_v1
          asset_path: assets/third_party/innerscene/toast-two-small-appliance.glb
          source_asset: Innerscene Toast Two - Small Appliance
          source_license: CC0-1.0
          orientation: y_up_to_z_up
          texture_tint_rgb: [0.48, 0.48, 0.52]
          appearance: dark_metal_body_silver_front_black_top_slots
          collision_profile: toaster_open_slot_shell_v1
          slot_floor_relative_z_m: 0.0345
          power_cord: true
        initial_pose_by_layout:
          0: {position_m: [0.47, 0.08, 0.1406], euler_xyz_deg: [0, 0, 90]}
          1: {position_m: [0.47, 0.00, 0.1406], euler_xyz_deg: [0, 0, 90]}
        reset_relation: anchored_on_table_bread_partly_inserted_slot_empty_otherwise
      - id: bread
        role: movable_slice_initially_partly_inside_toaster
        asset_ref: u13_bread_slice
        dimensions_m: [0.114, 0.014, 0.109]
        static: false
        mobility: movable_rigid_proxy
        visual_geometry:
          template_ref: bread_v7_slice
          asset_path: assets/third_party/bread_v7/bread-slice-v7.glb
          source_asset: bread_v7 textured slice (CC0)
          source_license: CC0-1.0
          source_dimensions_z_up_m: [0.114, 0.014, 0.109]
          orientation_transform: y_up_to_z_up
          orientation: y_up_to_z_up
          appearance: single_golden_toast_slice_with_browned_crust
          collision_profile: bread_slice_box_v1
        initial_pose_by_layout:
          0: {position_m: [0.47, 0.08, 0.2351], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.47, 0.00, 0.2351], euler_xyz_deg: [0, 0, 0]}
        reset_relation: lower_edge_inside_one_slot_upper_edge_graspable
      - id: plate
        role: fixed_empty_placement_target
        asset_ref: u13_plate
        dimensions_m: [0.22, 0.22, 0.018]
        color_rgb: [0.78, 0.66, 0.48]
        static: true
        mobility: static
        visual_geometry:
          template_ref: plate_round_v1
          appearance: shallow_concave_warm_tan_round_plate_with_raised_rim
          concavity_depth_m: 0.008
          collision_profile: plate_support_surface_v1
        initial_pose_by_layout:
          0: {position_m: [0.79, -0.06, 0.0541], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.79, -0.14, 0.0541], euler_xyz_deg: [0, 0, 0]}
        reset_relation: empty_and_within_one_gripper_transfer_of_toaster
      - id: orange_bowl_distractor
        role: visual_only_photo_context
        dimensions_m: [0.070, 0.070, 0.032]
        color_rgb: [0.78, 0.16, 0.035]
        static: true
        mobility: static_visual_distractor
        collision_geometry: none
        visual_geometry:
          template_ref: shallow_bowl_v1
          appearance: small_shallow_orange_red_bowl_identity_uncertain
        initial_pose_by_layout:
          0: {position_m: [0.65, 0.01, 0.061], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.65, -0.07, 0.061], euler_xyz_deg: [0, 0, 0]}
        reset_relation: small orange item between toaster and plate in the reference
    local_success_criteria:
      metric: bread_outside_toaster_and_supported_by_plate
      bread_clearance_from_toaster_m_min: 0.02
      bread_center_within_plate_xy_radius_m_max: 0.085
      bread_bottom_to_plate_surface_m_abs_max: 0.015
      stable_hold_seconds: 1.0
      report_as_paper_metric: false
    current_sim_support:
      physical_status: rigid_pick_place_proxy_feasible
      pipeline_status: not_inference_ready_generic_toaster_bread_plate_placeholders_and_wrong_remove_and_place_target
      inference_readiness: not_ready
      policy_success_claim_allowed: false

  - id: U14
    instruction: Cinch the drawstring of the bag
    env_template: tabletop_basic
    objects:
      - id: drawstring_bag
        role: deformable_open_bag_with_two_graspable_cord_ends
        asset_ref: u14_bag_visual_candidate
        interaction_geometry_asset_ref: project_proxy
        dimensions_m: [0.19, 0.15, 0.035]
        color_rgb: [0.035, 0.035, 0.040]
        visual_geometry:
          template_ref: drawstring_pouch_v1
          posture: soft_flat_pouch_mouth_gathered_but_open
          cord_color_rgb: [0.07, 0.07, 0.075]
        static: false
        mobility: deformable_articulated_proxy
        initial_pose_by_layout:
          0: {position_m: [0.55, 0.02, 0.0626], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.57, -0.05, 0.0626], euler_xyz_deg: [0, 0, 0]}
        components:
          - id: cord_end_left
            local_offset_m: [-0.060, 0.025, 0.010]
            mobility: movable_attached_cord
          - id: cord_end_right
            local_offset_m: [0.065, -0.040, 0.010]
            mobility: movable_attached_cord
        initial_mouth_diameter_m: 0.10
        reset_relation: flat_on_table_mouth_open_cord_ends_uncrossed_and_robot_facing
        visual_candidate_usage: optional_static_only_ai_provenance_requires_review
      - id: blue_cloth_distractor
        role: visual_only_photo_context
        dimensions_m: [0.065, 0.050, 0.009]
        color_rgb: [0.025, 0.22, 0.82]
        static: true
        mobility: static_visual_distractor
        collision_geometry: none
        visual_geometry:
          template_ref: folded_towel_v1
          appearance: small_flat_bright_blue_cloth_or_material_identity_uncertain
        initial_pose_by_layout:
          0: {position_m: [0.42, -0.09, 0.0495], euler_xyz_deg: [0, 0, 22]}
          1: {position_m: [0.44, -0.16, 0.0495], euler_xyz_deg: [0, 0, 22]}
        reset_relation: lies in front-left of the dark pouch as shown in the photo
    local_success_criteria:
      metric: mouth_cinched
      mouth_diameter_m_max: 0.04
      required_diameter_reduction_m_min: 0.05
      both_cord_ends_displaced_m_min: 0.03
      report_as_paper_metric: false
    current_sim_support:
      physical_status: soft_deformation_not_supported_by_current_task_pipeline
      pipeline_status: no_validated_cloth_or_cinch_model
      inference_readiness: not_ready
      policy_success_claim_allowed: false

  - id: U15
    instruction: Dispense the mustard onto the bread
    env_template: kitchen_counter
    objects:
      - id: mustard_bottle
        role: movable_condiment_dispenser
        asset_ref: u15_ycb_mustard_bottle
        dimensions_m: [0.075, 0.055, 0.18]
        color_rgb: [0.94, 0.78, 0.035]
        visual_geometry:
          template_ref: mustard_bottle_v1
          appearance: bright_yellow_squeeze_bottle_with_red_nozzle_cap
        static: false
        mobility: movable_rigid_proxy_with_visual_nozzle
        initial_pose_by_layout:
          0: {position_m: [0.36, 0.02, 0.1351], euler_xyz_deg: [0, 0, 0]}
          1: {position_m: [0.36, -0.06, 0.1351], euler_xyz_deg: [0, 0, 0]}
        reset_relation: upright_nozzle_closed_no_condiment_emitted
      - id: bread
        role: fixed_dry_dispense_target
        asset_ref: u13_bread_slice
        dimensions_m: [0.114, 0.109, 0.014]
        color_rgb: [0.78, 0.48, 0.22]
        visual_geometry:
          template_ref: bread_v7_slice
