schema_version: 1
spec_status: proposed_local_reconstruction
task_ids: [U01, U02, U03, U04, U05, U06, U07, U08, U09, U10]

provenance:
  paper_task_source: "https://arxiv.org/html/2602.15922"
  note: >-
    Appendix G supplies task images and instructions, not original USD scenes,
    exact CAD, metric prop poses, camera calibration, or success functions.
    Dimensions, colors, orientations, and relative positions below are visual
    estimates from the low-resolution reference frames, not recovered paper
    settings. The labeled visual-audit comparison sheet is the task-to-image
    authority for this revision. Files named paper_refs/Uxx.png are not
    consistently indexed by task ID; do not resolve a task image from basename
    alone. U10's image mapping is confirmed, while small-item identities remain
    uncertain.
  repository_asset_license_note: >-
    Local YCB assets are CC BY 4.0 and require attribution. Innerscene source
    assets below are CC0. Project-generated geometry has no third-party terms;
    the repository currently has no root LICENSE file, so its redistribution
    permission is not yet explicitly declared.

coordinate_frame:
  name: usd_world_robot_base_rooted
  units: meters
  pose_encoding: [x_world_m, y_world_m, z_world_m, roll_deg, pitch_deg, yaw_deg]
  dimensions_frame: object_local_xyz_before_pose_rotation
  table:
    center_xy_world_m: [0.55, 0.022]
    surface_z_world_m: 0.045
    bounds_xy_world_m: [[0.20, 0.90], [-0.478, 0.522]]
    source: "scripts/build_appendix_g_scenes.py: TABLE_CENTER_X/Y and TABLE_SURFACE_Z"
  semantic_axes:
    U01_right_world_xy: [1.0, 0.0]

reference_image_review:
  evidence: visual_audit_20261014/U01_U05.jpg through U16_U20.jpg, labeled task rows
  paper_refs_basename_warning: >-
    Individual files paper_refs/Uxx.png do not consistently correspond to the
    task ID in their basename. Use the labeled comparison-sheet row and the
    source mapping recorded in this spec.
  inspection_only_camera: >-
    Auto-framed reference view, 28 degree elevation from -Y. In this view,
    screen-right is world +X and screen-back is world +Y. This is for visual
    inspection only; policy and existing review cameras are unchanged.
  template_contract:
    U01: handled_pink_mug_v1 with a visible side-handle opening and identifiable axis
    U02: open_folding_fan_with_radial_ribs_v1; rounded_square_dish_v1; layered_burger_v1
    U03: bread_v7_loaf with one full-loaf visual and hidden second collision half; knife; blue-handled scissors
    U04: keyboard_v1 with requested QWERTY/H-I legend atlas; green_soft_bundle_v1
    U05: transparent_tall_drinking_glass_v1; thin_clear_straw_v1
    U06: inverted_blue_cup_v1; warm_red_bowl_v1; hidden_yellow_token_v1
    U07: shallow_yellow_vessel_v1; deeper_yellow_bowl_v1; blue_bowl_v1; yellow_and_blue_block_like_items
    U08: multi_face_shape_sorter_box_with_true_apertures_v1; two_uncertain_colored_blocks
    U09: shallow_rectangular_tray_v1 with requested upright variant; small_gray_metal_bar_v1; separate red_cube_v1
    U10: three_open_colored_bowls_v1; uncertain_contents_cluster_v1; slim_metal_implement_uncertain_v1

paired_layout_protocol:
  layout_ids: [0, 1]
  deterministic: true
  randomization: none
  paired_across_models: >-
    Compare policies with the same task_id and layout_id; both receive the
    exact authored poses below. Layout 1 is a fixed alternate initial state,
    not a random sample or a claim about the paper's undisclosed poses.
  reset_policy: >-
    On every reset, restore each object's authored pose for the selected
    layout, clear velocities, restore joint/compound states, and keep static
    fixtures fixed. Do not carry state between episodes.

tasks:
  U01:
    instruction: "Orient the mug so the handle is to the right"
    env_template: tabletop_basic
    interaction_class: rigid_reorientation
    support_status: supported_proxy
    inference_ready: false
    inference_blocker: >-
      The mug handle remains too small to establish its initial left/right
      orientation reliably in the exterior-camera preview. The wrist view
      shows it, but that is not enough to accept this as a reviewed scene.
    evaluator:
      current_repo_name: orient_object
      implemented: true
      local_success_rule: >-
        The calibrated mug-handle axis is within 30 degrees of world +X in XY.
      local_proxy_success_reportable: true
      semantic_success_claim_allowed: false
      paper_metric_claim_allowed: false
      notes: >-
        This is a local final-orientation proxy only. Normalize the imported
        mesh so its handle axis is known; do not assume the YCB mesh's local
        handle axis without inspecting it.
    objects:
      mug:
        role: manipulated_object
        # The photo shows a small pink open mug centered on the tabletop. Keep
        # the measured YCB mug proportions; the pink appearance and visible
        # handle are image-derived overrides, not a recovered paper asset.
        dimensions_m: [0.117, 0.093, 0.081]
        color_rgb: [0.78, 0.40, 0.58]
        mobility: dynamic_rigid
        reset_relation: >-
          Restore layout pose; the scanned mesh handle axis is local +X, so
          yaw=180 degrees makes it initially point toward world -X.
        asset:
          kind: repository_archive
          path: assets/third_party/ycb/downloads/025_mug_google_16k.tgz
          format: "YCB Google-scanner 16k archive; extract textured OBJ/MTL/PNG"
          measured_mesh_bounds_m: [0.116984, 0.093131, 0.081303]
          handle_axis_local_xyz: [1.0, 0.0, 0.0]
          license: CC-BY-4.0
          license_url: https://creativecommons.org/licenses/by/4.0/
          redistribution: allowed_with_attribution_and_notice
        visual_geometry:
          type: procedural_template
          template_ref: handled_pink_mug_v1
          appearance: pink_glazed_open_mug_with_side_handle
          handle_axis_local_xyz: [1.0, 0.0, 0.0]
          handle_opening_must_be_visible: true
          material_rgb: [0.78, 0.40, 0.58]
    layouts:
      layout_0:
        # The low-resolution paper frame does not resolve its initial handle
        # direction. This authored initial direction is an explicit estimate.
        mug: [0.55, 0.022, 0.0855, 0.0, 0.0, 180.0]
      layout_1:
        mug: [0.59, -0.038, 0.0855, 0.0, 0.0, 180.0]

  U02:
    instruction: "Fan the burger"
    env_template: tabletop_basic
    interaction_class: fan_motion_without_airflow_model
    support_status: unsupported
    inference_ready: false
    evaluator:
      current_repo_name: repeated_contact_motion
      implemented: false
      local_success_rule: null
      local_proxy_success_reportable: false
      semantic_success_claim_allowed: false
      paper_metric_claim_allowed: false
      diagnostic_only: >-
        A future trajectory logger may count repeated lateral end-effector
        sweeps above the burger, but that measures a gesture, not cooling.
    objects:
      plate:
        role: fixed_serving_surface
        # Rounded-square teal dish; the burger is visibly much smaller than it.
        dimensions_m: [0.155, 0.130, 0.014]
        color_rgb: [0.03, 0.39, 0.40]
        mobility: static_fixture
        reset_relation: restore_layout_pose; burger remains centered on plate
        visual_geometry:
          type: procedural_template
          template_ref: rounded_square_dish_v1
          silhouette: rounded_rectangle_with_soft_corners
          rim_height_m: 0.008
        asset:
          kind: project_generated_usd
          generator: "scripts/build_appendix_g_scenes.py#_define_object"
          format: USD
          license: project_license_unresolved
          redistribution: not_explicitly_granted
      burger:
        role: task_target
        # Approximate the small layered burger centered on the dish; omit fries
        # because none are discernible in the task image.
        dimensions_m: [0.072, 0.066, 0.040]
        source_dimensions_m: [0.28, 0.28, 0.089]
        source_scale: 0.45
        mobility: dynamic_rigid
        reset_relation: restore_layout_pose; centered on plate; no initial motion
        color_rgb: [0.70, 0.36, 0.12]
        visual_geometry:
          type: procedural_template
          template_ref: burger_layered_v1
          layers: [top_bun, patty, lettuce, bottom_bun]
          omit_fries: true
        asset:
          kind: external_source_not_downloaded
          url: https://www.innerscene.com/tools/library/3d-parts/burger-with-fries-43d1dcb1
          format: GLB
          source_file_size_mb: 20.1
          license: CC0-1.0
          license_url: https://creativecommons.org/publicdomain/zero/1.0/
          redistribution: allowed
          adaptation: >-
            Scale the complete burger-with-fries model to 0.45 unless the
            burger submesh can be isolated without losing provenance; fries
            remain static visual distractors if retained.
      folding_fan:
        role: manipulated_task_tool
        dimensions_m: [0.145, 0.100, 0.008]
        mobility: dynamic_rigid
        reset_relation: >-
          Rest flat on the tabletop left of the plate; keep the open leaf
          directed toward the back of the table and the handle toward the front.
        visual_geometry:
          type: procedural_template
          # Keep the supported project template as the resolver key; fan_open
          # is the corresponding short canonical name in the visual plan.
          template_ref: project_open_folding_fan_v1
          canonical_template_ref: fan_open
          appearance: off_white_leaf_with_gray_radial_ribs_and_light_handle
          open_sector_degrees: 110
          visible_radial_ribs: true
          leaf_width_matches_plate_short_axis: true
        collision_geometry:
          type: thin_box_contact_proxy
          description: hidden rectangular proxy approximating the fan leaf and handle
        asset:
          kind: project_generated_usd
          generator: "scripts/build_appendix_g_scenes.py#_define_u02_folding_fan"
          format: USD
          license: project_authored
          redistribution: project_license_unresolved
    layouts:
      layout_0:
        # Camera convention: screen-right is world +X; screen-back is +Y.
        # The open fan is left of the plate; burger stays centered on plate.
        plate: [0.60, 0.02, 0.050, 0.0, 0.0, 0.0]
        burger: [0.60, 0.02, 0.075, 0.0, 0.0, 0.0]
        folding_fan: [0.44, 0.02, 0.049, 0.0, 0.0, 0.0]
      layout_1:
        plate: [0.64, -0.04, 0.050, 0.0, 0.0, 0.0]
        burger: [0.64, -0.04, 0.075, 0.0, 0.0, 0.0]
        folding_fan: [0.48, -0.04, 0.049, 0.0, 0.0, 0.0]

  U03:
    instruction: "Slice the bread with the knife"
    env_template: kitchen_counter
    interaction_class: tool_use_cutting
    support_status: unsupported
    inference_ready: false
    evaluator:
      current_repo_name: tool_interaction
      implemented: false
      local_success_rule:
        status: proposed_not_implemented
        predicate: >-
          Knife tip contacts the marked cross-cut line, executes a downward
          stroke, and the two bread halves separate by at least 0.02 m.
      local_proxy_success_reportable: false
      semantic_success_claim_allowed: false
      paper_metric_claim_allowed: false
      notes: >-
        Ordinary rigid-body collision cannot cut a mesh. The two-half,
        breakable-joint representation below is a future proxy, not a current
        supported cutting simulation.
    objects:
      cutting_board:
        role: static_fixture
        # The photo shows bread directly on the wood tabletop, not a separate
        # board. Retain only a non-rendered support/collision reference.
        dimensions_m: [0.30, 0.15, 0.006]
        color_rgb: [0.47, 0.29, 0.16]
        mobility: static_fixture
        reset_relation: fixed to tabletop for each layout
        visual_geometry:
          type: procedural_template
          template_ref: cutting_board_wood_v1
          render_hidden: true
          appearance: none_in_reference; tabletop_is_the_visible_support
        asset:
          kind: project_generated_usd
          generator: "scripts/build_appendix_g_scenes.py#_define_box"
          format: USD
          license: project_license_unresolved
          redistribution: not_explicitly_granted
      bread_half_a:
        role: cuttable_target_part
        dimensions_m: [0.24, 0.065, 0.045]
        mobility: compound_dynamic_future_proxy
        reset_relation: >-
          Restore joined state; zero gap to bread_half_b at the cross-cut seam;
          both halves rest on cutting_board.
        asset:
          kind: local_cc0_glb
          path: assets/third_party/bread_v7/bread-loaf-v7.glb
          format: GLB; Z-up bounds [0.240, 0.114, 0.1096] m
          source_dimensions_m: [0.240, 0.114, 0.1096]
          orientation_transform: y_up_to_z_up
          visual_split: two_touching_halves_on_hidden_cross_cut_seam
          license: CC0-1.0
          license_url: https://creativecommons.org/publicdomain/zero/1.0/
          redistribution: allowed
        color_rgb: [0.78, 0.31, 0.07]
        visual_geometry:
          type: procedural_template
          template_ref: bread_v7_loaf
          asset_path: assets/third_party/bread_v7/bread-loaf-v7.glb
          orientation: z_up
          visual_dimensions_m: [0.24, 0.114, 0.1096]
          visual_root_rotation_deg: [0.0, 0.0, 0.0]
          render_as_full_continuous_loaf: true
          appearance: textured_elongated_loaf; preserve_source_aspect_ratio
          initial_state: single_full_loaf_visual_on_half_a_root
          collision_proxy:
            shape: half_box
            dimensions_m: [0.12, 0.114, 0.1096]
            local_center_m: [-0.06, 0.0, 0.0]
            cut_plane_world_x_relative_to_root: 0.0
            validation_status: unsupported_physics_proxy_not_validated
      bread_half_b:
        role: cuttable_target_part
        dimensions_m: [0.12, 0.114, 0.1096]
        mobility: compound_dynamic_future_proxy
        reset_relation: >-
          Restore joined state; zero gap to bread_half_a at the cross-cut seam;
          both halves rest on cutting_board.
        asset_ref: bread_half_a
        color_rgb: [0.78, 0.31, 0.07]
        visual_geometry:
          type: procedural_template
          template_ref: bread_v7_loaf
          asset_path: assets/third_party/bread_v7/bread-loaf-v7.glb
          render_hidden: true
          appearance: hidden_collision_half_only
          initial_state: visually_joined_half_b
          collision_proxy:
            shape: half_box
            dimensions_m: [0.12, 0.114, 0.1096]
            local_center_m: [0.06, 0.0, 0.0]
            cut_plane_world_x_relative_to_root: 0.0
            validation_status: unsupported_physics_proxy_not_validated
      knife:
        role: manipulated_tool
        dimensions_m: [0.12, 0.022, 0.012]
        mobility: dynamic_rigid
        reset_relation: >-
          Restore at the foreground-left of the loaf, angled diagonally across
          its width as estimated from the image.
        visual_geometry:
          type: procedural_template
          template_ref: kitchen_knife_v1
          blade_rgb: [0.23, 0.25, 0.27]
          handle_rgb: [0.78, 0.72, 0.60]
        asset:
          kind: repository_archive
          path: assets/third_party/ycb/downloads/032_knife_google_16k.tgz
          format: "YCB Google-scanner 16k archive; extract textured OBJ/MTL/PNG"
          license: CC-BY-4.0
          license_url: https://creativecommons.org/licenses/by/4.0/
          redistribution: allowed_with_attribution_and_notice
      scissors:
        role: visible_task_distractor
        # Scaled to the clearly smaller blue-handled scissors in the photo.
        dimensions_m: [0.064, 0.135, 0.011]
        mobility: dynamic_rigid
        reset_relation: >-
          Rest on the tabletop in front-right of the loaf, with blue handles
          toward image-right/front and the blades toward image-left/back.
        asset:
          kind: repository_mesh
          paths:
            - assets/third_party/ycb/037_scissors/google_16k/textured.obj
            - assets/third_party/ycb/037_scissors/google_16k/textured.mtl
            - assets/third_party/ycb/037_scissors/google_16k/texture_map.png
          format: YCB Google-scanner 16k mesh with project blue-handle material override
          license: CC-BY-4.0
          license_url: https://creativecommons.org/licenses/by/4.0/
          redistribution: allowed_with_attribution_and_notice
          modification_notice_required: true
        visual_geometry:
          type: procedural_template
          template_ref: scissors
          handle_rgb: [0.04, 0.31, 0.88]
          blade_rgb: [0.56, 0.59, 0.61]
    task_geometry:
      loaf_long_axis_world: X
      cut_plane_world_x_relative_to_layout: 0.0
      initial_joint: fixed_breakable_proxy
      knife_blade_crosses_loaf_width: true
    layouts:
      layout_0:
        # One continuous horizontal loaf on the table; cuttable halves meet
        # along a hidden seam. Knife is foreground-left; scissors foreground-right.
        cutting_board: [0.59, 0.02, 0.048, 0.0, 0.0, 0.0]
        bread_half_a: [0.59, 0.02, 0.0676, 0.0, 0.0, 0.0]
        bread_half_b: [0.59, 0.02, 0.0999, 0.0, 0.0, 0.0]
        knife: [0.43, -0.12, 0.057, 0.0, 0.0, 30.0]
        scissors: [0.77, -0.12, 0.054, 0.0, 0.0, 35.0]
      layout_1:
        cutting_board: [0.63, -0.038, 0.048, 0.0, 0.0, 0.0]
        bread_half_a: [0.63, -0.038, 0.0676, 0.0, 0.0, 0.0]
        bread_half_b: [0.63, -0.038, 0.0999, 0.0, 0.0, 0.0]
        knife: [0.47, -0.178, 0.057, 0.0, 0.0, 30.0]
        scissors: [0.81, -0.178, 0.054, 0.0, 0.0, 35.0]

  U04:
    instruction: "Type 'hi' on the keyboard"
    env_template: office_table
    interaction_class: articulated_key_press_sequence
    support_status: unsupported
    inference_ready: false
    evaluator:
      current_repo_name: key_sequence
      implemented: false
      local_success_rule:
        status: proposed_not_implemented
        predicate: >-
          Record key travel >= 0.001 m for H followed by I, with a release
          between presses; hovering/contact without travel is not a keystroke.
      local_proxy_success_reportable: false
      semantic_success_claim_allowed: false
      paper_metric_claim_allowed: false
    # A bright green object is visible behind-left of the keyboard in the
    # reference. It has no task object ID here; do not silently invent one.
    objects:
      keyboard_base:
        role: static_fixture
        dimensions_m: [0.37, 0.164, 0.04]
        color_rgb: [0.055, 0.060, 0.065]
        mobility: static_fixture
        reset_relation: restore fixed base pose; keys reset to unpressed height
        visual_geometry:
          type: procedural_template
          template_ref: keyboard_v1
          requested_visual_variant: black_qwerty_keyboard_with_legible_H_I
          appearance: black_full_qwerty_keyboard_with_visible_key_grid
          key_legend_rgb: [0.88, 0.88, 0.85]
        asset:
          kind: external_source_not_downloaded
          url: https://www.innerscene.com/tools/library/3d-parts/split-key-split-keyboard-b5531053
          format: GLB shell visual plus project-generated QWERTY key overlay
          source_dimensions_m: [0.37, 0.164, 0.04]
          license: CC0-1.0
          license_url: https://creativecommons.org/publicdomain/zero/1.0/
          redistribution: allowed
          adaptation: >-
            Do not trust source key labels/topology. Use an authored QWERTY
            overlay with independently tracked H and I keys at the coordinates
            below; retain the source shell only as visual geometry.
      H_key:
        role: articulated_target_key
        dimensions_m: [0.014, 0.014, 0.006]
        color_rgb: [0.10, 0.10, 0.10]
        mobility: articulated_prismatic_future_proxy
        reset_relation: attached to keyboard_base; reset unpressed; travel along -Z
        visual_geometry:
          type: procedural_template
          template_ref: keyboard_keycap_v1
          legend: H
        asset:
          kind: project_generated_usd
          generator: "scene override key overlay"
          format: USD
          license: project_license_unresolved
          redistribution: not_explicitly_granted
      I_key:
        role: articulated_target_key
        dimensions_m: [0.014, 0.014, 0.006]
        color_rgb: [0.10, 0.10, 0.10]
        mobility: articulated_prismatic_future_proxy
        reset_relation: attached to keyboard_base; reset unpressed; travel along -Z
        asset_ref: H_key
        visual_geometry:
          type: procedural_template
          template_ref: keyboard_keycap_v1
          legend: I
      green_bundle_distractor:
        role: visual_only_photo_context
        dimensions_m: [0.120, 0.090, 0.060]
        color_rgb: [0.12, 0.72, 0.12]
        mobility: static_visual_distractor
        collision_geometry: none
        reset_relation: lies behind-left of the keyboard in the source photo
        visual_geometry:
          type: procedural_template
          template_ref: green_soft_bundle_v1
          appearance: small_irregular_bright_green_bundle_identity_uncertain
    layouts:
      layout_0:
        # Keyboard long axis follows screen X; the green bundle is behind it.
        keyboard_base: [0.54, 0.00, 0.065, 0.0, 0.0, 0.0]
        H_key: [0.54, -0.025, 0.088, 0.0, 0.0, 0.0]
        I_key: [0.56, 0.025, 0.088, 0.0, 0.0, 0.0]
        green_bundle_distractor: [0.62, 0.18, 0.065, 0.0, 0.0, -12.0]
      layout_1:
        keyboard_base: [0.58, -0.06, 0.065, 0.0, 0.0, 0.0]
        H_key: [0.58, -0.085, 0.088, 0.0, 0.0, 0.0]
        I_key: [0.60, -0.035, 0.088, 0.0, 0.0, 0.0]
        green_bundle_distractor: [0.66, 0.12, 0.065, 0.0, 0.0, -12.0]

  U05:
    instruction: "Extricate the straw from the cup"
    env_template: tabletop_basic
    interaction_class: rigid_container_extraction
    support_status: unsupported
    inference_ready: false
    evaluator:
      current_repo_name: remove_from_container
      implemented: true
      existing_rule_diagnostic_only: "source root displacement > 0.20 m"
      local_success_rule:
        status: proposed_not_implemented
        predicate: >-
          The whole straw body is outside the cup opening/interior and the
          cup remains within 0.02 m of its reset pose.
      local_proxy_success_reportable: false
      semantic_success_claim_allowed: false
      paper_metric_claim_allowed: false
      notes: >-
        The 0.20 m source-root displacement threshold is not an extraction
        test: it can reject a valid shorter pull and accept lateral movement
        without clearing the rim. Replace it with a whole-straw-outside-rim
        predicate and a cup-reset-pose check. Do not use its current success
        boolean as task success.
    objects:
      cup:
        role: static_container_fixture
        # The reference is a small clear drinking glass with a narrow straw,
        # not a paper cup or the much larger mug scan.
        dimensions_m: [0.065, 0.065, 0.105]
        mobility: static_fixture
        reset_relation: >-
          Restore fixed pose on the tabletop; straw starts through the centered
          mouth opening. The clear glass appearance and dimensions are visual
          estimates from the small task image.
        visual_geometry:
          type: procedural_template
          template_ref: transparent_tall_drinking_glass_v1
          appearance: clear_blue_tinted_drinking_glass_with_visible_contents
          wall_thickness_m: 0.0035
          rim_thickness_m: 0.002
          taper_ratio_top_to_base: 1.08
          # Two nearly overlapping shell surfaces otherwise compound to an
          # opaque-looking wall and hide the straw inside the glass.
          transparency: 0.82
          material_rgb: [0.66, 0.78, 0.82]
        asset:
          kind: project_generated_usd
          generator: open_cup_v1
          format: clear open cylindrical glass proxy
          license: project_license_unresolved
          redistribution: not_explicitly_granted
      straw:
        role: manipulated_object
        dimensions_m: [0.006, 0.006, 0.115]
        # Smoke gray and a realistic ~6 mm straw diameter make it readable
        # through the clear glass in both inspection and policy-camera views.
        color_rgb: [0.30, 0.36, 0.38]
        mobility: dynamic_rigid
        reset_relation: >-
          Restore through the cup center with a slight +3 degree pitch about
          world Y, matching the nearly upright translucent straw in the image.
